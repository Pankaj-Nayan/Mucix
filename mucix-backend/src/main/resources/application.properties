spring.application.name=Mucix

# Server configuration
server.address=0.0.0.0
server.port=6969

# MySQL Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mucix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MMMCCVI}

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Security default user
spring.security.user.name=juaa
spring.security.user.password=juee

# Multipart file upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local storage and processing configuration
mucix.storage.upload-dir=storage/uploads
mucix.python-service.url=http://localhost:8000
